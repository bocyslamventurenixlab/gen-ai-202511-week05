<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vintage Google API Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper-1: #a69677;
        --paper-2: #403b33;
        --paper-3: #bf8a49;
        --paper-4: #d9bfa0;
        --paper-5: #0d0d0d;
        --ink: #1d1a16;
        --panel: rgba(216, 191, 160, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: 'Space Mono', monospace;
        background:
          radial-gradient(1000px 500px at -10% -20%, rgba(165, 149, 119, 0.45), transparent 60%),
          radial-gradient(700px 400px at 110% -10%, rgba(191, 137, 72, 0.3), transparent 65%),
          linear-gradient(145deg, #efe1cf 0%, #d9bfa0 45%, #a69677 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.09;
        background-image:
          linear-gradient(transparent 50%, rgba(13, 13, 13, 0.15) 50%),
          linear-gradient(90deg, rgba(13, 13, 13, 0.08) 50%, transparent 50%);
        background-size: 3px 3px, 4px 4px;
      }

      .shell {
        width: min(980px, 100%);
        background: var(--panel);
        border: 1px solid rgba(64, 59, 51, 0.45);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 50px rgba(13, 13, 13, 0.22);
        transform: translateY(14px);
        opacity: 0;
        animation: rise 680ms ease-out forwards;
      }

      .header {
        padding: 28px 30px 20px;
        border-bottom: 1px dashed rgba(64, 59, 51, 0.5);
        background: linear-gradient(180deg, rgba(255, 248, 235, 0.55) 0%, rgba(216, 191, 160, 0.3) 100%);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(64, 59, 51, 0.35);
        font-size: 12px;
        background: rgba(255, 255, 255, 0.38);
      }

      h1 {
        margin: 14px 0 6px;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2rem, 5.5vw, 3.35rem);
        line-height: 1;
        color: var(--paper-5);
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 0;
        color: var(--paper-2);
        font-size: 14px;
      }

      .content {
        padding: 22px 30px 30px;
        display: grid;
        gap: 18px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 170px 1fr auto;
        gap: 10px;
      }

      .field,
      .btn {
        width: 100%;
        height: 46px;
        border-radius: 11px;
        border: 1px solid rgba(64, 59, 51, 0.45);
        padding: 0 14px;
        font-family: inherit;
        font-size: 14px;
        color: var(--paper-5);
      }

      .field {
        background: rgba(255, 249, 241, 0.84);
        outline: none;
        transition: border-color 170ms ease, box-shadow 170ms ease;
      }

      .field:focus {
        border-color: var(--paper-3);
        box-shadow: 0 0 0 3px rgba(191, 137, 72, 0.25);
      }

      .btn {
        width: auto;
        min-width: 120px;
        padding: 0 18px;
        cursor: pointer;
        background: linear-gradient(180deg, #d6a463, #bf8a49);
        color: #fff7ea;
        font-weight: 700;
        transition: transform 150ms ease, filter 150ms ease;
      }

      .btn:hover {
        filter: brightness(1.05);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .auth-link {
        display: inline-block;
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--paper-2);
      }

      .auth-link:hover {
        color: var(--paper-5);
      }

      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .result-title {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.55rem;
      }

      .status {
        font-size: 12px;
        background: rgba(255, 255, 255, 0.45);
        border: 1px solid rgba(64, 59, 51, 0.26);
        border-radius: 999px;
        padding: 4px 10px;
      }

      pre {
        margin: 0;
        border-radius: 14px;
        border: 1px solid rgba(64, 59, 51, 0.45);
        background: rgba(13, 13, 13, 0.9);
        color: #f2e4cf;
        padding: 16px;
        min-height: 200px;
        max-height: 52vh;
        overflow: auto;
        line-height: 1.5;
        box-shadow: inset 0 0 0 1px rgba(191, 137, 72, 0.12);
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 860px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .btn {
          width: 100%;
        }

        .header,
        .content {
          padding-left: 18px;
          padding-right: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="shell">
      <section class="header">
        <span class="badge">Vintage Console</span>
        <h1>Google API Explorer</h1>
        <p class="subtitle">Run Gmail, Docs, and Sheets queries through a single, old-paper inspired interface.</p>
      </section>

      <section class="content">
        <div class="toolbar">
          <select id="service" class="field" aria-label="Choose Google service">
            <option value="gmail">Gmail</option>
            <option value="docs">Google Docs</option>
            <option value="sheets">Google Sheets</option>
          </select>
          <input id="q" class="field" placeholder="Search query (optional)" aria-label="Search query" />
          <button id="run" class="btn">Run Request</button>
        </div>

        <a href="/api/auth" target="_blank" class="auth-link">Start OAuth flow to generate refresh token</a>

        <div class="result-head">
          <h2 class="result-title">Response</h2>
          <span id="status" class="status">Idle</span>
        </div>

        <pre id="out">No results yet</pre>
      </section>
    </main>

    <script>
      const out = document.getElementById('out');
      const statusEl = document.getElementById('status');
      const runBtn = document.getElementById('run');

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      runBtn.onclick = async () => {
        const svc = document.getElementById('service').value;
        const q = encodeURIComponent(document.getElementById('q').value || '');
        const url = `/api/${svc}${q ? '?q=' + q : ''}`;

        out.textContent = 'Loading...';
        setStatus('Loading');
        runBtn.disabled = true;

        try {
          const r = await fetch(url);
          const data = await r.json();
          out.textContent = JSON.stringify(data, null, 2);
          setStatus(r.ok ? 'Success' : 'Request Error');
        } catch (e) {
          out.textContent = 'Error: ' + e.message;
          setStatus('Network Error');
        } finally {
          runBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
